[project]
name = "songmaker"
version = "1.0.0"
description = "AI-powered song generation engine — songs from markdown files"
authors = [{ name = "Flex0r (Felix Hummert)", email = "felix.hummert@gmail.com" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12,<3.13"

dependencies = [
    "numpy>=1.26,<3",
    "scipy>=1.12,<2",
    "pydantic>=2.0,<3",
    "pydantic-settings>=2.0,<3",
    "cyclopts>=4.0,<6",
    "pyloudnorm>=0.1,<1",
    "httpx>=0.27,<1",
    "python-slugify>=8.0,<10",
]

[project.optional-dependencies]
similarity = ["sentence-transformers>=3,<7"]
scoring = [
    "librosa>=0.10,<2",
    "soundfile",
    "audiobox-aesthetics>=0.0.4,<1",
    "torch>=2.14,<2.15",
    "torchaudio>=2.11,<3",
    "torchcodec>=0.14,<0.15",  # torchaudio 2.9+ decodes through torchcodec, whose minor tracks torch's
    "nvidia-ml-py3>=7.352,<8",
]
whisper = [
    "faster-whisper>=1.1,<2",
    "torch>=2.14,<2.15",
    "soundfile",
    "librosa>=0.10,<2",
    "numba",
]
server = [
    "fastapi>=0.100,<1",
    "uvicorn>=0.20,<1",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13,<2",
    "python-dotenv>=1.0,<2",
    "structlog>=24.0,<27",
    "redis[hiredis]>=5.0,<9",
    "psycopg2-binary>=2.9,<3",
    "arq>=0.26,<1",
    "mutagen>=1.47,<2",
    "python-multipart>=0.0.7,<1",
    # The auth layer lives in its own repository since #879. A release wheel, not a
    # git pin: the slim images have no git and the acestep-worker installs with
    # --require-hashes.
    "overnightworks-webauth[redis] @ https://github.com/overnightworks/webauth/releases/download/v0.24.0/overnightworks_webauth-0.24.0-py3-none-any.whl#sha256=51e568884b14dbe005fe9b1174cb6546843357f23a298b3d3acbd17bdc1039b7",
    # The provider layer lives in its own repository since #886. Bare in the
    # server extra so its api/image capabilities do not leak anthropic into the
    # music worker or Pillow into the scoring worker (A8).
    "overnightworks-agent-providers @ https://github.com/overnightworks/agent-providers/releases/download/v0.1.3/overnightworks_agent_providers-0.1.3-py3-none-any.whl",
]
# The provider layer's two optional capabilities (issue #825): its HTTP-API
# routes and the Claude SDK, and the image route that normalizes a generated
# cover. A container installs only the ones its entrypoint reaches.
api = [
    "httpx>=0.27,<1",
    "anthropic>=0.20,<2",
]
image = [
    "pillow>=13,<14",
]
mcp = [
    "mcp>=2.2,<3",
]
# The co-writer's MCP endpoint: the agent service calls the
# tools back over it. The release wheel of an immutable tag, like the other
# release wheels.
agent-service = [
    "overnightworks-agent-runtime-client[mcp-server] @ https://github.com/overnightworks/agent-runtime/releases/download/v0.10.0/overnightworks_agent_runtime_client-0.10.0-py3-none-any.whl#sha256=b5d15a343ed74aa1bad50c0327983c5008cda9e11b173e6fd0db8ffa1bee9ea9",
]
acestep-worker = [
    "fastapi>=0.100,<1",
    "uvicorn>=0.20,<1",
    "redis[hiredis]>=5.0,<9",
    "huggingface_hub>=0.20,<3",
    "nvidia-ml-py3>=7.352,<8",
]
dev = [
    "pytest>=7.0,<10",
    "pytest-cov>=7.0,<8",
    "pytest-xdist>=3.8,<4",
    "ruff>=0.4,<1",
    "import-linter>=2.0,<3",
    "fakeredis[lua]>=2.0,<3",
    # Reads back what monitoring/alertmanager-entrypoint.sh generates, so
    # its escaping is asserted against a real YAML parser instead of
    # against matching text (issue #333).
    "pyyaml>=6.0,<7",
]

[project.scripts]
songmaker = "songmaker_cli.main:main"

[project.urls]
Repository = "https://github.com/flex0r/songmaker"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = [
    "acestep_engine*",
    "acestep_worker*",
    "audio_engine*",
    "songmaker_cli*",
]

# ---------------------------------------------------------------
# uv configuration
# ---------------------------------------------------------------
# The appkit wheel carries the family look (tokens and fonts) that the frontend
# build copies out of it. It reaches only scripts/copy_kit_assets.py: never make
# this a default group or include it in an image's sync or export, or the wheel
# lands in the production venvs.
[dependency-groups]
frontend = [
    "overnightworks-appkit @ https://github.com/overnightworks/appkit/releases/download/v0.5.0/overnightworks_appkit-0.5.0-py3-none-any.whl#sha256=7539a8a42d3e07aaf71e14fae63db0eb59806eb641c18c87abad5b67ea21ada1",
]

[tool.uv]
override-dependencies = [
    "numpy>=1.26",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }
torchcodec = { index = "pytorch-cpu" }

# ---------------------------------------------------------------
# Tool configuration
# ---------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
"scripts/vulture_whitelist.py" = ["E402", "I001"]
"tests/test_scorers.py" = ["E402", "I001"]
"tests/test_scorers_extended.py" = ["E402", "I001"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = [
    "B101",  # assert in tests
    "B310",  # urlopen — URLs are from config, not user input
    "B404",  # subprocess import — required for ffmpeg and ACE-Step
    "B603",  # subprocess without shell — intentional, uses list args
    "B110",  # try/except/pass — used in cleanup paths (GPU, subprocess, model unload)
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

# ---------------------------------------------------------------
# External tools (must be on system PATH):
#   ffmpeg      — MP3 encoding
# ---------------------------------------------------------------
