[project]
name = "songmaker"
version = "1.0.0"
description = "AI-powered song generation engine — songs from markdown files"
authors = [{ name = "Flex0r (Felix Hummert)", email = "felix.hummert@gmail.com" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.14"

dependencies = [
    "numpy>=1.26,<3",
    "scipy>=1.12,<2",
    "pydantic>=2.0,<3",
    "pydantic-settings>=2.0,<3",
    "cyclopts>=4.0,<6",
    "pyloudnorm>=0.1,<1",
    "httpx>=0.27,<1",
    "python-slugify>=8.0,<10",
]

[project.optional-dependencies]
signal = [
    "librosa>=0.10,<2",
    "soundfile",
]
scoring = [
    "songmaker[signal]",
    "audiobox-aesthetics>=0.0.4,<1",
    "torch>=2.14,<2.15",
    "torchaudio>=2.11,<3",
    "torchcodec>=0.14,<0.15",  # torchaudio 2.9+ decodes through torchcodec, whose minor tracks torch's
]
whisper = [
    "faster-whisper>=1.1,<2",
    "torch>=2.14,<2.15",
    "songmaker[signal]",
    "numba",
]
server = [
    "fastapi>=0.100,<1",
    "uvicorn>=0.50,<1",
    "sqlalchemy>=2.1,<3",
    "alembic>=1.13,<2",
    "structlog>=24.0,<27",
    "redis[hiredis]>=5.0,<9",
    "psycopg[binary]>=3.2,<4",
    "arq>=0.26,<1",
    "mutagen>=1.47,<2",
    # The object store's S3 client (object_store.py); botocore reads the platform's endpoint, region and credentials file.
    "boto3>=1.36,<2",
    "python-multipart>=0.0.7,<1",
    # The auth layer lives in its own repository. The first-party libraries are
    # git pins by tag: a release-asset wheel in the resolved tree makes a uv Dependabot
    # run fail as a whole. Integrity is the commit uv.lock records for the tag, which
    # `uv sync --frozen` installs; the three images carry git for it.
    "overnightworks-webauth[postgres,redis] @ git+https://github.com/overnightworks/webauth@v0.46.0",
    # Bare: Settings imports the client's AgentConfig in every process, and both worker images
    # install this extra. Its HTTP backend sits in the agent extra, which only the web image installs.
    "overnightworks-agents @ git+https://github.com/overnightworks/agents@v0.70.0",
    # Cross-pod coordination in Redis (owner lease). A git pin by tag like the other two.
    "overnightworks-tandem @ git+https://github.com/overnightworks/tandem@v0.13.1",
    # Every process writes its lines through logline; tandem's range names it, so the host pins the tag.
    "overnightworks-logline @ git+https://github.com/overnightworks/logline@v1.9.0",
]
# Pillow normalizes a generated cover; a container installs it only when its entrypoint reaches it.
image = [
    "pillow>=13,<14",
]
# The co-writer's gateway backend (GatewayBackend) and the MCP front of a person's own agent:
# the web image installs them. A git pin by tag, like the other first-party libraries.
agent = [
    "overnightworks-agents[backend,mcp-server] @ git+https://github.com/overnightworks/agents@v0.70.0",
]
acestep-worker = [
    "fastapi>=0.100,<1",
    "uvicorn>=0.50,<1",
    "redis[hiredis]>=5.0,<9",
    # The GPU hold is a tandem lock; the worker writes its lines through logline. Git pins by tag
    # like the server extra's, from the same tags.
    "overnightworks-tandem @ git+https://github.com/overnightworks/tandem@v0.13.1",
    "overnightworks-logline @ git+https://github.com/overnightworks/logline@v1.9.0",
    # logline imports it at start; the server extra pins the same range.
    "structlog>=24.0,<27",
    "huggingface_hub>=0.20,<3",
    "nvidia-ml-py3>=7.352,<8",
]
dev = [
    "pytest>=7.0,<10",
    "pytest-cov>=7.0,<8",
    "pytest-randomly>=3.15,<5",
    "pytest-xdist>=3.8,<4",
    "packaging>=24.1",
    "ruff>=0.4,<1",
    "mypy>=1.13,<3",
    "import-linter>=2.0,<3",
    "fakeredis[lua]>=2.0,<3",
    # Carries a static GPL build of ffmpeg for the tests that run the real binary
    # (tests/support/ffmpeg_binary.py); no image installs this extra, so no image holds it.
    "imageio-ffmpeg>=0.8,<1",
    # Reads the workflow and Compose files the tests and image-pin check assert on.
    "pyyaml>=6.0,<7",
    # Brings the catalog generator `design-catalogs`; the git tag pin builds the package from source,
    # installed in CI and local checks only, never in an image.
    "overnightworks-design[catalogs] @ git+https://github.com/overnightworks/design@v0.33.1",
]

[project.scripts]
songmaker = "songmaker_cli.main:main"

[project.urls]
Repository = "https://github.com/flex0r/songmaker"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.design-catalogs]
source = "en"
python = "src/songmaker_cli/words.py"

[tool.setuptools.packages.find]
where = ["src"]
include = [
    "songmaker_acestep_engine*",
    "songmaker_acestep_worker*",
    "songmaker_audio_engine*",
    "songmaker_cli*",
]

# ---------------------------------------------------------------
# uv configuration
# ---------------------------------------------------------------
[tool.uv]
override-dependencies = [
    "numpy>=1.26",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }
torchcodec = { index = "pytorch-cpu" }

# ---------------------------------------------------------------
# Tool configuration
# ---------------------------------------------------------------
[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "PLE2502"]

[tool.ruff.lint.per-file-ignores]
"tests/songmaker_cli/test_scoring_scorers.py" = ["E402", "I001"]
"tests/songmaker_cli/test_scoring_scorers_extended.py" = ["E402", "I001"]
# why: design-catalogs writes the module with its own layout (a sentence per line, the lookup's long lines), and `design-catalogs --check` proves it current.
"src/songmaker_cli/words.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

# ---------------------------------------------------------------
# External tools (must be on system PATH):
#   ffmpeg      — MP3 encoding; the tests take theirs from the dev extra's imageio-ffmpeg
# ---------------------------------------------------------------

[tool.mypy]
files = ["src/songmaker_cli"]
plugins = ["pydantic.mypy"]

# Extras absent from the CI venv (audiobox_aesthetics, faster_whisper, torch) and scipy and
# boto3, which ship no stubs, do not resolve.
[[tool.mypy.overrides]]
module = ["audiobox_aesthetics.infer", "faster_whisper", "torch", "scipy", "scipy.signal", "boto3", "botocore.*"]
ignore_missing_imports = true
