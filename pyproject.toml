[project]
name = "songmaker"
version = "1.0.0"
description = "AI-powered song generation engine — songs from markdown files"
authors = [{ name = "Flex0r (Felix Hummert)", email = "felix.hummert@gmail.com" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.14"

dependencies = [
    "numpy>=1.26,<3",
    "scipy>=1.12,<2",
    "pydantic>=2.0,<3",
    "pydantic-settings>=2.0,<3",
    "cyclopts>=4.0,<6",
    "pyloudnorm>=0.1,<1",
    "httpx>=0.27,<1",
    "python-slugify>=8.0,<10",
]

[project.optional-dependencies]
signal = [
    "librosa>=0.10,<2",
    "soundfile",
]
scoring = [
    "songmaker[signal]",
    "audiobox-aesthetics>=0.0.4,<1",
    "torch>=2.14,<2.15",
    "torchaudio>=2.11,<3",
    "torchcodec>=0.14,<0.15",  # torchaudio 2.9+ decodes through torchcodec, whose minor tracks torch's
]
whisper = [
    "faster-whisper>=1.1,<2",
    "torch>=2.14,<2.15",
    "songmaker[signal]",
    "numba",
]
server = [
    "fastapi>=0.100,<1",
    "uvicorn>=0.50,<1",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13,<2",
    "structlog>=24.0,<27",
    "redis[hiredis]>=5.0,<9",
    "psycopg2-binary>=2.9,<3",
    "arq>=0.26,<1",
    "mutagen>=1.47,<2",
    "python-multipart>=0.0.7,<1",
    # The auth layer lives in its own repository. The two first-party libraries are
    # git pins by tag: a release-asset wheel in the resolved tree makes a uv Dependabot
    # run fail as a whole. Integrity is the commit uv.lock records for the tag, which
    # `uv sync --frozen` installs; the three images carry git for it.
    "overnightworks-webauth[redis] @ git+https://github.com/overnightworks/webauth@v0.37.1",
    # Bare: Settings imports the client's AgentConfig in every process, and both worker images
    # install this extra. Its HTTP backend sits in the agent extra, which only the web image installs.
    "overnightworks-agents @ git+https://github.com/overnightworks/agents@v0.32.0",
]
# Pillow normalizes a generated cover; a container installs it only when its entrypoint reaches it.
image = [
    "pillow>=13,<14",
]
# The co-writer's gateway backend (GatewayBackend) and the MCP front of a person's own agent:
# the web image installs them. A git pin by tag, like the other first-party libraries.
agent = [
    "overnightworks-agents[backend,mcp-server] @ git+https://github.com/overnightworks/agents@v0.32.0",
]
acestep-worker = [
    "fastapi>=0.100,<1",
    "uvicorn>=0.50,<1",
    "redis[hiredis]>=5.0,<9",
    "huggingface_hub>=0.20,<3",
    "nvidia-ml-py3>=7.352,<8",
]
dev = [
    "pytest>=7.0,<10",
    "pytest-cov>=7.0,<8",
    "pytest-xdist>=3.8,<4",
    "packaging>=24.1",
    "ruff>=0.4,<1",
    "import-linter>=2.0,<3",
    "fakeredis[lua]>=2.0,<3",
    # Reads back what monitoring/scripts/start_alertmanager.sh generates, so
    # its escaping is asserted against a real YAML parser instead of
    # against matching text (issue #333).
    "pyyaml>=6.0,<7",
    # Brings the catalog generator `design-catalogs`; a git pin by tag like the other
    # first-party libraries, built from source in CI and local checks only, never in an image.
    "overnightworks-design[catalogs] @ git+https://github.com/overnightworks/design@v0.25.0",
]

[project.scripts]
songmaker = "songmaker_cli.main:main"

[project.urls]
Repository = "https://github.com/flex0r/songmaker"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.design-catalogs]
source = "en"

[tool.setuptools.packages.find]
where = ["src"]
include = [
    "acestep_engine*",
    "acestep_worker*",
    "audio_engine*",
    "songmaker_cli*",
]

# ---------------------------------------------------------------
# uv configuration
# ---------------------------------------------------------------
[tool.uv]
override-dependencies = [
    "numpy>=1.26",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }
torchcodec = { index = "pytorch-cpu" }

# ---------------------------------------------------------------
# Tool configuration
# ---------------------------------------------------------------
[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "PLE2502"]

[tool.ruff.lint.per-file-ignores]
"tests/songmaker_cli/test_scoring_scorers.py" = ["E402", "I001"]
"tests/songmaker_cli/test_scoring_scorers_extended.py" = ["E402", "I001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

# ---------------------------------------------------------------
# External tools (must be on system PATH):
#   ffmpeg      — MP3 encoding
# ---------------------------------------------------------------
