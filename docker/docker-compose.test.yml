# The test stack: CI's e2e boot, the probes and local e2e runs. The platform
# serves the app; nothing here is a deploy.
#
# Run every Compose call from the repository root, so the project name, the
# root `.env` and the relative paths below keep resolving there:
#   docker compose --project-directory . -f docker/docker-compose.test.yml <command>
#
# `profiles: [gpu]` keeps the ACE-Step worker and the scoring worker (torch and
# a baked Whisper checkpoint) out of both `docker compose config` and `up`; the
# GPU probe and the Voices stack name the profile. The default services fit an
# ubuntu-24.04 runner. A test stack nobody tore down must stay down after a
# reboot, so no service sets a restart policy.

# Bare args take the value from compose's environment and are omitted when unset.
x-web-image-build: &web-image-build
  context: .
  dockerfile: Dockerfile
  args:
    SONGMAKER_RELEASE:
    SONGMAKER_COMMIT:
    # E2E maps the shipped bundle back to source for its coverage report.
    BUILD_SOURCE_MAPS: "true"

services:
  postgres:
    image: postgres:17.11-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-songmaker}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: ${POSTGRES_DB:-songmaker}
    secrets:
      - postgres_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-songmaker}"]
      interval: 5s
      timeout: 3s
      retries: 5
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - FOWNER
      - DAC_READ_SEARCH

  redis:
    image: redis:7.4.12-alpine@sha256:338fbfc036dc5517ac0b04d6de21521085935336e565f223406180e9d84166e2
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID

  songmaker-web:
    build: *web-image-build
    # tini as PID 1 reaps orphaned processes, which uv run as PID 1 does not.
    init: true
    depends_on:
      - postgres
      - redis
    # Every process migrates in init_db under an advisory lock, so a starter
    # blocked behind a running migration is "starting" until it ends; the
    # start period outlasts any migration.
    healthcheck:
      test:
        - CMD
        - /app/.venv/bin/python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8080/health')
      interval: 30s
      timeout: 5s
      start_period: 600s
      retries: 3
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-songmaker}@postgres:5432/${POSTGRES_DB:-songmaker}
      REDIS_URL: redis://redis:6379/0
      FINAL_DELETION_DAYS:
      # The container's own healthcheck calls localhost and the ACE-Step control
      # plane calls songmaker-web, so the Host check admits these whatever
      # ALLOWED_HOSTS lists.
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-},localhost,127.0.0.1,songmaker-web
      OIDC_ISSUER: ${OIDC_ISSUER:?OIDC_ISSUER must be set}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-songmaker}
      OIDC_CLIENT_SECRET_FILE: /run/secrets/keycloak_client_secret
      # The co-writer's gateway; hal owns these values (its docs/agent-service.md, "An app's side").
      AGENT__BACKEND: litellm
      AGENT__GATEWAY__ORIGIN: http://litellm-front:4000
      AGENT__GATEWAY__KEY_FILE: /run/secrets/gateway_key
      AGENT__API_GROUP: /services/agent-service/api
      AGENT__MCP_AGENT_GROUP: /agents
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      TOKEN_CLIENTS: ${TOKEN_CLIENTS:-}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-172.16.0.0/12}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      # Every API request of one shard's run -- seeds, cleanups, retries and
      # browser traffic -- comes from the runner's one address. In CI each
      # shard of a project has its own job and stack; a local run drives both
      # projects, whole, through one stack, so this limit is sized for that run.
      # The E2E workflow's "Busiest API and sign-in rate-limit windows" step
      # prints the measured peak on every run; keep this at least 3x above it,
      # with room for one retry inside the window (#1555).
      IP_RATE_LIMIT: "8000"
      # The 2026-09-05 CI run opened 30 streams successfully; the 31st returned 429.
      RESOURCE_EVENT_STREAM_OPEN_LIMIT: "200"
      # Every stream open of one stack's run (resource events and job
      # streams) comes from the runner's one address: CI run 36716007334
      # (2026-09-30) opened 45 in one minute and the next job stream open
      # returned 429.
      STREAM_RATE_LIMIT: "200"
      # Every sign-in, callback and logout of the run comes from the runner's
      # one address too. The same step prints the busiest sign-in window per
      # shard; keep this at least 3x the summed peak of both projects, because
      # a local run drives them through one stack.
      SIGN_IN_RATE_LIMIT: "120"
      GENERATION_RATE_LIMIT_USER: ${GENERATION_RATE_LIMIT_USER:-30}
      MAX_USER_LORAS: "${MAX_USER_LORAS:-10}"
      MAX_QUEUED_LORA_TRAINING_JOBS: "${MAX_QUEUED_LORA_TRAINING_JOBS:-2}"
      # The runner reaches songmaker-web over plain http, not through a TLS
      # terminator, so a Secure/__Host- cookie would never come back.
      COOKIE_SECURE: "false"
      LOG_FORMAT: json
      HOST: "0.0.0.0"
    # Each file is mounted only into the services that read it; the settings
    # read /run/secrets/<name> by their field names.
    secrets:
      - keycloak_client_secret
      - gateway_key
      - session_secret
      - postgres_password
      - songmaker_internal_token
      - songmaker_monitoring_token
    # Loopback only: Docker-published ports bypass ufw, so an all-interface
    # binding would expose a test stack to the LAN (#328, #1355). In-cluster
    # callers use songmaker-web:8080 on the compose network.
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    volumes:
      - audiofiles:/app/data/audio
      - queuestreams:/app/data/queue-streams
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  songmaker-music-worker:
    build:
      context: .
      dockerfile: docker/music-worker.Dockerfile
    command: ["songmaker_cli.music_worker.MusicWorkerSettings"]
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "scripts/arq_healthcheck.py", "music"]
      interval: 30s
      timeout: 5s
      start_period: 600s
      retries: 3
    depends_on:
      - postgres
      - redis
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-songmaker}@postgres:5432/${POSTGRES_DB:-songmaker}
      REDIS_URL: redis://redis:6379/0
      FINAL_DELETION_DAYS:
      MUSIC_MAX_JOBS: "${MUSIC_MAX_JOBS:-2}"
      ARQ_JOB_TIMEOUT: "${ARQ_JOB_TIMEOUT:-1000}"
      LORA_TRAINING_JOB_TIMEOUT: "${LORA_TRAINING_JOB_TIMEOUT:-3600}"
      LORA_TRAINING_EPOCHS: "${LORA_TRAINING_EPOCHS:-500}"
      LORA_TRAINING_BATCH_SIZE: "${LORA_TRAINING_BATCH_SIZE:-1}"
      LORA_TRAINING_GRADIENT_ACCUMULATION: "${LORA_TRAINING_GRADIENT_ACCUMULATION:-4}"
      LORA_TRAINING_SAVE_EVERY_N_EPOCHS: "${LORA_TRAINING_SAVE_EVERY_N_EPOCHS:-5}"
      LORA_TRAINING_POLL_INTERVAL_SECONDS: "${LORA_TRAINING_POLL_INTERVAL_SECONDS:-5}"
      LOG_FORMAT: json
    secrets:
      - session_secret
      - postgres_password
      - songmaker_internal_token
    volumes:
      - audiofiles:/app/data/audio

  songmaker-acestep-worker-0:
    profiles: ["gpu"]
    build:
      context: .
      dockerfile: docker/acestep-worker.Dockerfile
    runtime: nvidia
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      - redis
    environment:
      WORKER_ID: "acestep-worker-0"
      WORKER_HOST: "songmaker-acestep-worker-0"
      WORKER_PORT: "8001"
      GPU_ID: "0"
      NVIDIA_VISIBLE_DEVICES: "0"
      VRAM_BUDGET_GB: "${ACESTEP_WORKER_VRAM_GB:-24}"
      ACESTEP_LM_MODEL_PATH: "${ACESTEP_LM_MODEL_PATH:-acestep-5Hz-lm-4B}"
      # Empty means "use ACE-Step's own default": the GPU tier's
      # max_duration_with_lm, and a single sample per request.
      ACESTEP_LM_DIT_RESERVE_DURATION_S: "${ACESTEP_LM_DIT_RESERVE_DURATION_S:-}"
      ACESTEP_LM_DIT_RESERVE_BATCH: "${ACESTEP_LM_DIT_RESERVE_BATCH:-}"
      # The fork's LM allocator keeps the DiT's duration-aware demand free, so
      # long xl-turbo takes pass the preflight honestly. Set to 1 only as an
      # emergency bypass: a failing preflight then turns into an OOM
      # mid-generation.
      ACESTEP_SKIP_VRAM_PREFLIGHT: "${ACESTEP_SKIP_VRAM_PREFLIGHT:-0}"
      ACESTEP_CHECKPOINT_DIR: "/opt/acestep"
      AUDIO_OUTPUT_DIR: "/app/data/worker_output"
      REDIS_URL: redis://redis:6379/0
      CONTROL_PLANE_URL: http://songmaker-web:8080
      HF_HUB_DISABLE_XET: "1"
    secrets:
      - songmaker_internal_token
    volumes:
      - ./vendor/acestep/checkpoints:/opt/acestep/checkpoints
      - audiofiles:/app/data/audio
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  songmaker-scoring-worker:
    profiles: ["gpu"]
    build:
      context: .
      dockerfile: docker/scoring-worker.Dockerfile
    command: ["songmaker_cli.scoring_worker.ScoringWorkerSettings"]
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "scripts/arq_healthcheck.py", "scoring"]
      interval: 30s
      timeout: 5s
      start_period: 600s
      retries: 3
    depends_on:
      - postgres
      - redis
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-songmaker}@postgres:5432/${POSTGRES_DB:-songmaker}
      REDIS_URL: redis://redis:6379/0
      SCORING_DEVICE: "${SCORING_DEVICE:-cpu}"
      SCORING_MAX_JOBS: "${SCORING_MAX_JOBS:-1}"
      SCORER_TIMEOUT_SECONDS: "${SCORER_TIMEOUT_SECONDS:-120}"
      TEXT_ACCURACY_TIMEOUT_SECONDS: "${TEXT_ACCURACY_TIMEOUT_SECONDS:-300}"
      LOG_FORMAT: json
    secrets:
      - session_secret
      - postgres_password
      - songmaker_internal_token
    volumes:
      - audiofiles:/app/data/audio

# Every file below is a throwaway the caller writes: CI writes them under
# RUNNER_TEMP, a probe in a scratch directory.
secrets:
  keycloak_client_secret:
    file: ${KEYCLOAK_CLIENT_SECRET_FILE:?KEYCLOAK_CLIENT_SECRET_FILE must be set}
  gateway_key:
    file: ${GATEWAY_KEY_FILE:?GATEWAY_KEY_FILE must be set}
  session_secret:
    file: ${SONGMAKER_SECRETS_DIR:?SONGMAKER_SECRETS_DIR must be set}/session-secret
  postgres_password:
    file: ${SONGMAKER_SECRETS_DIR:?SONGMAKER_SECRETS_DIR must be set}/postgres-password
  songmaker_internal_token:
    file: ${SONGMAKER_SECRETS_DIR:?SONGMAKER_SECRETS_DIR must be set}/internal-token
  songmaker_monitoring_token:
    file: ${SONGMAKER_SECRETS_DIR:?SONGMAKER_SECRETS_DIR must be set}/monitoring-token

volumes:
  pgdata:
  redisdata:
  audiofiles:
  queuestreams:
