# CI override for docker-compose.yml — boots only the web-facing services
# (no GPU, no monitoring) so the stack fits an ubuntu-latest runner.
# `profiles: [gpu]` keeps the GPU/monitoring services out of both
# `docker compose config` and `up` without needing to delete them here.
x-gha-cache: &gha_cache
  cache_from:
    - type=gha
  cache_to:
    - type=gha,mode=max

services:
  prometheus:
    profiles: ["gpu"]
  grafana:
    profiles: ["gpu"]
  songmaker-acestep-worker-0:
    profiles: ["gpu"]
  songmaker-music-worker:
    profiles: ["gpu"]
  songmaker-scoring-worker:
    profiles: ["gpu"]

  migrate:
    build:
      <<: *gha_cache

  songmaker-web:
    build:
      <<: *gha_cache
    # The full desktop + mobile suite measured 449 API requests in one run
    # (CI run 34039372545, 2026-09-06, with admin-models.spec.ts); keep the
    # isolated stack well above that burst. Production remains at its 120/600
    # limits.
    environment:
      IP_RATE_LIMIT: "2000"
      # The 2026-09-05 CI run opened 30 streams successfully; the 31st returned 429.
      RESOURCE_EVENT_STREAM_OPEN_LIMIT: "200"
      # `auth-flows.spec.ts` drives a real lockout, so these two are inverted
      # against production on purpose (see that spec's header and
      # `e2e/README.md`). The short-window budget counts failures per *IP*, and
      # the whole run comes from one address: production's 5 would refuse every
      # later login from the runner for five minutes, including the correct
      # ones the other flows type. Measured cost of the spec: 3 failed attempts
      # per project (one lockout sequence), 6 per suite run, 12 across CI's one
      # retry -- 40 carries more than three times that headroom. The lockout
      # counts per *account*, so lowering it to 3 keeps the refusal on the
      # spec's own throwaway user and costs 3 requests instead of 15.
      # Production remains at 5 / 15 / 3600.
      LOGIN_RATE_LIMIT: "40"
      LOGIN_LOCKOUT_THRESHOLD: "3"
      LOGIN_LOCKOUT_WINDOW: "60"
    ports: !override
      - "${WEB_PORT:-8080}:8080"
    # The isolated CI stack does not load the host profile; the cover-proof
    # path ends here explicitly, while production keeps songmaker-web.
    security_opt: !override
      - apparmor=docker-default
    # !override drops the host Claude-CLI bind mounts — CI has no host
    # Claude credentials and must not depend on the operator's machine.
    volumes: !override
      - audiofiles:/app/data/audio
      - queuestreams:/app/data/queue-streams
