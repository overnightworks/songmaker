# CI override for docker-compose.yml — boots the web-facing services and the
# music worker (no GPU, no monitoring) so the stack fits an ubuntu-24.04 runner.
# `profiles: [gpu]` keeps the ACE-Step worker, the scoring worker (torch and a
# baked Whisper checkpoint) and the monitoring services out of both
# `docker compose config` and `up` without needing to delete them here.

# A test stack nobody tore down must stay down after a reboot, while the live
# stack keeps `unless-stopped`; every service below merges this (#1355).
x-test-stack-service: &test_stack_service
  restart: "no"

services:
  postgres:
    <<: *test_stack_service
  redis:
    <<: *test_stack_service
  alertmanager:
    <<: *test_stack_service
  prometheus:
    <<: *test_stack_service
    profiles: ["gpu"]
  grafana:
    <<: *test_stack_service
    profiles: ["gpu"]
  songmaker-acestep-worker-0:
    <<: *test_stack_service
    profiles: ["gpu"]
  songmaker-music-worker:
    <<: *test_stack_service
  songmaker-scoring-worker:
    <<: *test_stack_service
    profiles: ["gpu"]

  songmaker-web:
    <<: *test_stack_service
    build:
      # E2E maps the shipped bundle back to source for its coverage report.
      args:
        BUILD_SOURCE_MAPS: "true"
    # Every API request of one shard's run -- seeds, cleanups, retries and
    # browser traffic -- comes from the runner's one address. In CI each
    # shard of a project has its own job and stack; a local run drives both
    # projects, whole, through one stack, so this limit is sized for that run.
    # The E2E workflow's "Busiest API and sign-in rate-limit windows" step prints the
    # measured peak on every run; keep this at least 3x above it, with room
    # for one retry inside the window (#1555). Production remains at its
    # 120/600 limits.
    environment:
      IP_RATE_LIMIT: "8000"
      # The 2026-09-05 CI run opened 30 streams successfully; the 31st returned 429.
      RESOURCE_EVENT_STREAM_OPEN_LIMIT: "200"
      # Every stream open of one stack's run (resource events and job
      # streams) comes from the runner's one address: CI run 36716007334
      # (2026-09-30) opened 45 in one minute and the next job stream open
      # returned 429. Production remains at 45.
      STREAM_RATE_LIMIT: "200"
      # Every sign-in, callback and logout of the run comes from the runner's
      # one address too. The same step prints the busiest sign-in window per
      # shard; keep this at least 3x the summed peak of both projects, because
      # a local run drives them through one stack. Production keeps webauth's
      # sign-in budget.
      SIGN_IN_RATE_LIMIT: "120"
      # The runner reaches songmaker-web over plain http, not through a TLS
      # terminator, so a Secure/__Host- cookie would never come back.
      COOKIE_SECURE: "false"
    # Loopback only, like the live stack (#328): Docker-published ports bypass
    # ufw, so an all-interface binding would expose a test stack to the LAN.
    ports: !override
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    # The runner has no edge networks: only the default one, which reaches
    # PostgreSQL and Redis.
    networks: !override
      - default

# No runner and no local e2e stack has edge's network.
networks:
  hal_agent_songmaker: !reset null
