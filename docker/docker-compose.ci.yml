# CI override for docker-compose.yml — boots only the web-facing services
# (no GPU, no monitoring) so the stack fits an ubuntu-latest runner.
# `profiles: [gpu]` keeps the GPU/monitoring services out of both
# `docker compose config` and `up` without needing to delete them here.
x-gha-cache: &gha_cache
  cache_from:
    - type=gha
  cache_to:
    - type=gha,mode=max

# A test stack nobody tore down must stay down after a reboot, while the live
# stack keeps `unless-stopped`; every service below merges this (#1355).
x-test-stack-service: &test_stack_service
  restart: "no"

services:
  postgres:
    <<: *test_stack_service
  redis:
    <<: *test_stack_service
  alertmanager:
    <<: *test_stack_service
  prometheus:
    <<: *test_stack_service
    profiles: ["gpu"]
  grafana:
    <<: *test_stack_service
    profiles: ["gpu"]
  songmaker-acestep-worker-0:
    <<: *test_stack_service
    profiles: ["gpu"]
  songmaker-music-worker:
    <<: *test_stack_service
    profiles: ["gpu"]
  songmaker-scoring-worker:
    <<: *test_stack_service
    profiles: ["gpu"]

  migrate:
    <<: *test_stack_service
    build:
      <<: *gha_cache

  songmaker-web:
    <<: *test_stack_service
    build:
      <<: *gha_cache
    # Every API request of the whole suite -- seeds, cleanups, retries and
    # browser traffic, both projects -- comes from the runner's one address.
    # The E2E workflow's "Busiest API rate-limit window" step prints the
    # measured peak on every run; keep this at least 3x above it, with room
    # for one retry inside the window (#1555). Production remains at its
    # 120/600 limits.
    environment:
      IP_RATE_LIMIT: "8000"
      # The 2026-09-05 CI run opened 30 streams successfully; the 31st returned 429.
      RESOURCE_EVENT_STREAM_OPEN_LIMIT: "200"
      # Every stream open of the whole suite (resource events and job streams,
      # both projects) comes from the runner's one address: CI run 36716007334
      # (2026-09-30) opened 45 in one minute and the next job stream open
      # returned 429. Production remains at 45.
      STREAM_RATE_LIMIT: "200"
      # The runner reaches songmaker-web over plain http, not through a TLS
      # terminator, so a Secure/__Host- cookie would never come back.
      COOKIE_SECURE: "false"
    # Loopback only, like the live stack (#328): Docker-published ports bypass
    # ufw, so an all-interface binding would expose a test stack to the LAN.
    ports: !override
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    # The isolated CI stack does not load the host profile; the cover-proof
    # path ends here explicitly, while production keeps songmaker-web.
    security_opt: !override
      - apparmor=docker-default
    # The runner has no edge networks: only the default one, which reaches
    # PostgreSQL and Redis.
    networks: !override
      - default
    # !override drops the host Claude-CLI bind mounts — CI has no host
    # Claude credentials and must not depend on the operator's machine.
    volumes: !override
      - audiofiles:/app/data/audio
      - queuestreams:/app/data/queue-streams

# No runner and no local e2e stack has edge's network.
networks:
  hal_mcp_songmaker: !reset null

secrets:
  agent_service_signing_public_key:
    file: tests/fixtures/agent_service_capability_public_key.pem
