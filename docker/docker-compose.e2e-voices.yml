x-service-logging: &service-logging
  driver: journald
  options:
    tag: "{{.Name}}"
    labels: "com.docker.compose.service"

# Test-only override for the Voices browser flow.  It deliberately adds the
# fake worker here instead of changing docker-compose.ci.yml, so library E2E
# runs never start it.
services:
  songmaker-web:
    # Plain http, same as docker-compose.ci.yml this file always layers on
    # top of; named explicitly so this override stays correct standalone.
    environment:
      COOKIE_SECURE: "false"

  songmaker-music-worker:
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: ["/app/.venv/bin/python", "-m", "songmaker_cli.arq_worker"]
    command: ["songmaker_cli.music_worker.MusicWorkerSettings"]

  songmaker-voices-e2e-worker:
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: ["/app/.venv/bin/python", "/app/tests/support/fake_training_worker.py"]
    restart: "no"
    logging: *service-logging
    healthcheck:
      test:
        ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s
    depends_on:
      redis:
        condition: service_healthy
      songmaker-web:
        condition: service_healthy
    secrets:
      - songmaker_internal_token
    environment:
      REDIS_URL: redis://redis:6379/0
      SONGMAKER_INTERNAL_TOKEN_FILE: /run/secrets/songmaker_internal_token
      CONTROL_PLANE_URL: http://songmaker-web:8080
      AUDIO_DIR: /app/data/audio
      AUDIO_OUTPUT_DIR: /tmp/fake-worker-output
      WORKER_ID: voices-e2e-training-worker
      WORKER_HOST: songmaker-voices-e2e-worker
      WORKER_PORT: "8001"
      FAKE_GENERATION_OCCUPANCY_PROMPT: "E2E voices occupancy prompt"
    volumes:
      - audiofiles:/app/data/audio
      - type: bind
        source: ./tests/support/fake_training_worker.py
        target: /app/tests/support/fake_training_worker.py
        read_only: true
        bind:
          create_host_path: false
