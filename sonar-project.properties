sonar.organization=overnightworks
sonar.projectKey=overnightworks_songmaker
sonar.sources=src,frontend/src,prompts/sonar-scripts-measure
sonar.tests=tests,frontend
sonar.test.inclusions=tests/**,frontend/src/**/*.test.ts,frontend/e2e/**
sonar.exclusions=vendor/**,docs/design/**,frontend/e2e/test-results/**,frontend/playwright-report/**,**/node_modules/**,**/.svelte-kit/**,frontend/build/**
sonar.python.version=3.12
sonar.sourceEncoding=UTF-8
# The reusable quality gate restores the assembled artifact into the checkout.
sonar.python.coverage.reportPaths=coverage.xml
sonar.javascript.lcov.reportPaths=frontend-coverage/lcov.info

# Keep these coverage exclusions identical to .github/workflows/coveragerc-ci, except scripts/**, which
# exists on the Sonar side only. Each exception is limited to the named path and has a reason rather
# than hiding testable code.
# why: src/songmaker_cli/main.py is a CLI entry point with local recovery commands.
# why: src/songmaker_cli/scoring/audiobox_aesthetics.py needs a heavy model runtime absent from CI.
# why: src/songmaker_cli/scoring/emotional_dynamics.py needs a heavy model runtime absent from CI.
# why: src/songmaker_cli/scoring/lyrical_coherence.py requires an external provider runtime.
# why: src/songmaker_cli/scoring/text_accuracy.py requires the Whisper model absent from CI.
# why: src/songmaker_cli/db/migrations/versions/** requires Alembic/PostgreSQL semantics.
# why: frontend/src/service-worker.ts belongs to a browser/build proof, not Vitest coverage.
# why: scripts/** is outside the packages pytest --cov names, so touched lines would read as 0 % new code.
sonar.coverage.exclusions=src/songmaker_cli/main.py,src/songmaker_cli/scoring/audiobox_aesthetics.py,src/songmaker_cli/scoring/emotional_dynamics.py,src/songmaker_cli/scoring/lyrical_coherence.py,src/songmaker_cli/scoring/text_accuracy.py,src/songmaker_cli/db/migrations/versions/**,frontend/src/service-worker.ts,scripts/**

# why: generated API types and immutable database migrations are not maintained
# source; their structural similarity is not a product-code duplication signal.
sonar.cpd.exclusions=frontend/src/lib/api/types.ts,src/songmaker_cli/db/migrations/versions/**
