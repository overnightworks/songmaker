sonar.organization=overnightworks
sonar.projectKey=overnightworks_songmaker
sonar.sources=src,frontend/src,scripts
sonar.tests=tests,frontend
sonar.test.inclusions=tests/**,frontend/src/**/*.test.ts,frontend/e2e/**
sonar.exclusions=vendor/**,docs/mockups/**,frontend/e2e/test-results/**,frontend/playwright-report/**,**/node_modules/**,**/.svelte-kit/**,frontend/build/**
sonar.python.version=3.14
sonar.sourceEncoding=UTF-8
# The reusable quality gate restores the assembled artifact into the checkout.
sonar.python.coverage.reportPaths=coverage.xml
sonar.javascript.lcov.reportPaths=frontend-coverage/lcov.info

# Keep these coverage exclusions identical to .github/workflows/coveragerc-ci.ini, except scripts/**, which
# exists on the Sonar side only. Each exception is limited to the named path and has a reason rather
# than hiding testable code.
# why: src/songmaker_cli/main.py is a CLI entry point with local recovery commands.
# why: src/songmaker_cli/scoring/audiobox_aesthetics.py needs a heavy model runtime absent from CI.
# why: src/songmaker_cli/scoring/emotional_dynamics.py needs a heavy model runtime absent from CI.
# why: src/songmaker_cli/scoring/text_accuracy.py requires the Whisper model absent from CI.
# why: src/songmaker_cli/db/migrations/versions/** requires Alembic/PostgreSQL semantics.
# why: frontend/src/service-worker.ts belongs to a browser/build proof, not Vitest coverage.
# why: src/songmaker_cli/words.py is written by design-catalogs and proven by its --check, not by a test.
# why: scripts/** is outside the packages pytest --cov names, so touched lines would read as 0 % new code.
sonar.coverage.exclusions=src/songmaker_cli/main.py,src/songmaker_cli/scoring/audiobox_aesthetics.py,src/songmaker_cli/scoring/emotional_dynamics.py,src/songmaker_cli/scoring/text_accuracy.py,src/songmaker_cli/db/migrations/versions/**,frontend/src/service-worker.ts,src/songmaker_cli/words.py,scripts/**

# why: generated API types and generated word modules (written by the catalog generator,
# whose empty regeneration diff is the gate) are not maintained source, and immutable
# database migrations are not either; their structural similarity is not a product-code
# duplication signal.
sonar.cpd.exclusions=frontend/src/lib/api/types.ts,frontend/src/lib/words/**,src/songmaker_cli/words.py,src/songmaker_cli/db/migrations/versions/**

# why: src/songmaker_cli/words.py is written by design-catalogs, which emits every catalog sentence as a
# literal of its own; surfaces that say the same sentence ('Album {title}') keep their own keys, so the
# module repeats the literal and `design-catalogs --check` owns its content. Only this rule on this file.
sonar.issue.ignore.multicriteria=wordsRepeatedLiteral
sonar.issue.ignore.multicriteria.wordsRepeatedLiteral.ruleKey=python:S1192
sonar.issue.ignore.multicriteria.wordsRepeatedLiteral.resourceKey=src/songmaker_cli/words.py
