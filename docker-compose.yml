x-logging: &service-logging
  driver: journald
  options:
    tag: "{{.Name}}"
    labels: "com.docker.compose.service"

# Bare args take the value from compose's environment and are omitted when unset.
x-web-image-build: &web-image-build
  context: .
  dockerfile: Dockerfile
  args:
    - SONGMAKER_RELEASE
    - SONGMAKER_COMMIT

services:
  postgres:
    image: postgres:16.15-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
    restart: unless-stopped
    logging: *service-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-songmaker}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: ${POSTGRES_DB:-songmaker}
    secrets:
      - postgres_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-songmaker}"]
      interval: 5s
      timeout: 3s
      retries: 5
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - FOWNER
      - DAC_READ_SEARCH

  redis:
    image: redis:7.4.12-alpine@sha256:338fbfc036dc5517ac0b04d6de21521085935336e565f223406180e9d84166e2
    restart: unless-stopped
    logging: *service-logging
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID

  songmaker-web:
    build: *web-image-build
    restart: unless-stopped
    # tini as PID 1 reaps orphaned processes, which uv run as PID 1 does not.
    init: true
    logging: *service-logging
    depends_on:
      - postgres
      - redis
    # Every process migrates in init_db under an advisory lock, so a starter
    # blocked behind a running migration is "starting" until it ends; the
    # start period outlasts any migration.
    healthcheck:
      test:
        - CMD
        - /app/.venv/bin/python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8080/health')
      interval: 30s
      timeout: 5s
      start_period: 600s
      retries: 3
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-songmaker}@postgres:5432/${POSTGRES_DB:-songmaker}
      REDIS_URL: redis://redis:6379/0
      FINAL_DELETION_DAYS:
      # The container's own healthcheck calls localhost and the ACE-Step control
      # plane and Prometheus call songmaker-web, so the Host check admits these
      # whatever ALLOWED_HOSTS lists.
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-},localhost,127.0.0.1,songmaker-web
      OIDC_ISSUER: ${OIDC_ISSUER:?OIDC_ISSUER must be set in .env (see docker/.env.docker.example)}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-songmaker}
      OIDC_CLIENT_SECRET_FILE: /run/secrets/keycloak_client_secret
      # The co-writer's gateway; hal owns these values (its docs/agent-service.md, "An app's side").
      AGENT__BACKEND: litellm
      AGENT__GATEWAY__ORIGIN: http://litellm-front:4000
      AGENT__GATEWAY__KEY_FILE: /run/secrets/gateway_key
      AGENT__API_GROUP: /services/agent-service/api
      AGENT__MCP_AGENT_GROUP: /agents
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      TOKEN_CLIENTS: ${TOKEN_CLIENTS:-}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-172.16.0.0/12}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      GENERATION_RATE_LIMIT_USER: ${GENERATION_RATE_LIMIT_USER:-30}
      MAX_USER_LORAS: "${MAX_USER_LORAS:-10}"
      MAX_QUEUED_LORA_TRAINING_JOBS: "${MAX_QUEUED_LORA_TRAINING_JOBS:-2}"
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      LOG_FORMAT: json
      HOST: "0.0.0.0"
    # Each file is mounted only into the services that read it; the settings
    # read /run/secrets/<name> by their field names.
    secrets:
      - keycloak_client_secret
      - gateway_key
      - session_secret
      - postgres_password
      - songmaker_internal_token
      - songmaker_monitoring_token
    # backchannel: the private network on which the realm posts its back-channel
    # logout to <public host>:8080; nothing else joins it.
    # hal_agent_songmaker: edge's per-app network on which songmaker-web reaches
    # the co-writer's gateway.
    networks:
      default: {}
      backchannel:
        aliases: [songmaker.hallucinai.de]
      hal_agent_songmaker: {}
    # Published to the loopback interface only: Docker's NAT chain bypasses
    # the INPUT chain (and with it UFW), so a "8080:8080" binding reaches the
    # whole LAN regardless of the host firewall. Everything that needs this
    # port is host-local (the cloudflared tunnel, the Vite dev proxy, the
    # CLI); in-cluster callers use songmaker-web:8080 on the compose network,
    # which is unaffected.
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - audiofiles:/app/data/audio
      - queuestreams:/app/data/queue-streams
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  songmaker-music-worker:
    build:
      context: .
      dockerfile: docker/music-worker.Dockerfile
    command: ["songmaker_cli.music_worker.MusicWorkerSettings"]
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *service-logging
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "scripts/arq_healthcheck.py", "music"]
      interval: 30s
      timeout: 5s
      start_period: 600s
      retries: 3
    depends_on:
      - postgres
      - redis
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-songmaker}@postgres:5432/${POSTGRES_DB:-songmaker}
      REDIS_URL: redis://redis:6379/0
      FINAL_DELETION_DAYS:
      MUSIC_MAX_JOBS: "${MUSIC_MAX_JOBS:-2}"
      ARQ_JOB_TIMEOUT: "${ARQ_JOB_TIMEOUT:-1000}"
      LORA_TRAINING_JOB_TIMEOUT: "${LORA_TRAINING_JOB_TIMEOUT:-3600}"
      LORA_TRAINING_EPOCHS: "${LORA_TRAINING_EPOCHS:-500}"
      LORA_TRAINING_BATCH_SIZE: "${LORA_TRAINING_BATCH_SIZE:-1}"
      LORA_TRAINING_GRADIENT_ACCUMULATION: "${LORA_TRAINING_GRADIENT_ACCUMULATION:-4}"
      LORA_TRAINING_SAVE_EVERY_N_EPOCHS: "${LORA_TRAINING_SAVE_EVERY_N_EPOCHS:-5}"
      LORA_TRAINING_POLL_INTERVAL_SECONDS: "${LORA_TRAINING_POLL_INTERVAL_SECONDS:-5}"
      LOG_FORMAT: json
    secrets:
      - session_secret
      - postgres_password
      - songmaker_internal_token
    volumes:
      - audiofiles:/app/data/audio

  songmaker-acestep-worker-0:
    build:
      context: .
      dockerfile: docker/acestep-worker.Dockerfile
    runtime: nvidia
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *service-logging
    depends_on:
      - redis
    environment:
      WORKER_ID: "acestep-worker-0"
      WORKER_HOST: "songmaker-acestep-worker-0"
      WORKER_PORT: "8001"
      GPU_ID: "0"
      NVIDIA_VISIBLE_DEVICES: "0"
      VRAM_BUDGET_GB: "${ACESTEP_WORKER_VRAM_GB:-24}"
      ACESTEP_STARTUP_TIMEOUT_SECONDS: "${ACESTEP_STARTUP_TIMEOUT_SECONDS:-540}"
      ACESTEP_LM_MODEL_PATH: "${ACESTEP_LM_MODEL_PATH:-acestep-5Hz-lm-4B}"
      # Empty means "use ACE-Step's own default": the GPU tier's
      # max_duration_with_lm, and a single sample per request.
      ACESTEP_LM_DIT_RESERVE_DURATION_S: "${ACESTEP_LM_DIT_RESERVE_DURATION_S:-}"
      ACESTEP_LM_DIT_RESERVE_BATCH: "${ACESTEP_LM_DIT_RESERVE_BATCH:-}"
      # The preflight is active again (#202): the fork's LM allocator now
      # keeps the DiT's duration-aware demand free, so long xl-turbo takes
      # pass it honestly. Set to 1 only as an emergency bypass — a failing
      # preflight then turns into an OOM mid-generation.
      ACESTEP_SKIP_VRAM_PREFLIGHT: "${ACESTEP_SKIP_VRAM_PREFLIGHT:-0}"
      ACESTEP_CHECKPOINT_DIR: "/opt/acestep"
      AUDIO_OUTPUT_DIR: "/app/data/worker_output"
      REDIS_URL: redis://redis:6379/0
      CONTROL_PLANE_URL: "${ACESTEP_WORKER_CONTROL_PLANE_URL:-http://songmaker-web:8080}"
      HF_TOKEN: "${HF_TOKEN:-}"
      HF_HUB_DISABLE_XET: "1"
    secrets:
      - songmaker_internal_token
    volumes:
      - ./vendor/acestep/checkpoints:/opt/acestep/checkpoints
      - audiofiles:/app/data/audio
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
  songmaker-scoring-worker:
    build:
      context: .
      dockerfile: docker/scoring-worker.Dockerfile
      secrets:
        - hf_token
    command: ["songmaker_cli.scoring_worker.ScoringWorkerSettings"]
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *service-logging
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "scripts/arq_healthcheck.py", "scoring"]
      interval: 30s
      timeout: 5s
      start_period: 600s
      retries: 3
    depends_on:
      - postgres
      - redis
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-songmaker}@postgres:5432/${POSTGRES_DB:-songmaker}
      REDIS_URL: redis://redis:6379/0
      SCORING_DEVICE: "${SCORING_DEVICE:-cpu}"
      SCORING_MAX_JOBS: "${SCORING_MAX_JOBS:-1}"
      SCORER_TIMEOUT_SECONDS: "${SCORER_TIMEOUT_SECONDS:-120}"
      TEXT_ACCURACY_TIMEOUT_SECONDS: "${TEXT_ACCURACY_TIMEOUT_SECONDS:-300}"
      LOG_FORMAT: json
    secrets:
      - session_secret
      - postgres_password
      - songmaker_internal_token
    volumes:
      - audiofiles:/app/data/audio
      - hfcache:/app/.cache/huggingface/hub

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    logging: *service-logging
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    ports:
      - "127.0.0.1:9090:9090"
    # Prometheus sends it as the bearer token of the songmaker job
    # (monitoring/prometheus.yml); web mounts the same source to check it.
    secrets:
      - source: songmaker_monitoring_token
        target: monitoring_token
    volumes:
      - ./monitoring:/etc/prometheus:ro
      - promdata:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 6
      # A cold Prometheus may replay its WAL before its ready endpoint responds.
      start_period: 60s
    depends_on:
      - songmaker-web
      - alertmanager
    cap_drop:
      - ALL

  # Delivers the four rules/alert.rules.yml conditions by email via Alertmanager's
  # own SMTP client (issue #333) — see monitoring/alertmanager.yml.template
  # for why this owns delivery instead of scripts/alert.sh or Grafana's
  # native alerting. Internal-only, same as prometheus above (no published
  # port): reached by Prometheus over the compose network, not by a human
  # browser directly.
  alertmanager:
    image: prom/alertmanager:latest
    restart: unless-stopped
    logging: *service-logging
    # Only the four non-secret values travel as environment (they are
    # readable in `docker inspect`, which for a hostname, a port and two
    # addresses is what they already are in docker/.env.docker.example). The
    # password does NOT: it is mounted as the smtp_password secret below
    # and read by Alertmanager itself from /run/secrets/smtp_password
    # (smtp_auth_password_file in the template), so it never reaches this
    # container's environment, argv, or writable layer.
    environment:
      ALERT_EMAIL_TO: "${ALERT_EMAIL_TO:-}"
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-}"
      SMTP_USER: "${SMTP_USER:-}"
    secrets:
      - smtp_password
    volumes:
      - ./monitoring/alertmanager.yml.template:/etc/alertmanager/alertmanager.yml.template:ro
      - ./monitoring/alertmanager-entrypoint.sh:/etc/alertmanager/entrypoint.sh:ro
      - alertmanagerdata:/alertmanager
    # The image's own ENTRYPOINT is /bin/alertmanager; entrypoint: replaces
    # it entirely so the SMTP config can be assembled first (see
    # monitoring/alertmanager-entrypoint.sh, which then execs the real
    # binary). Confirmed against prom/alertmanager:latest that /bin/sh,
    # /bin/sed and /bin/amtool all exist in this image — no envsubst, sed
    # substitution instead, and amtool validates the result before the
    # daemon ever sees it.
    entrypoint: ["/bin/sh", "/etc/alertmanager/entrypoint.sh"]
    # Without this, a container stuck in a config-error restart loop still
    # counts as "started" — `docker compose up --wait` would then wait on
    # it forever and wedge the auto-deploy tick holding the lock (issue
    # #333). Unhealthy is a state both `compose ps` and `--wait` can see.
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9093/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    cap_drop:
      - ALL

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    logging: *service-logging
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      # No default on purpose: an unset or empty value refuses the whole
      # stack instead of silently giving Grafana admin/admin (#1357).
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?GRAFANA_PASSWORD must be set in .env (see docker/.env.docker.example)}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    # Loopback only, same reason as songmaker-web above. Reach the dashboards
    # from another machine over an SSH tunnel, not over the LAN.
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafdata:/var/lib/grafana
      - ./monitoring/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    cap_drop:
      - ALL

secrets:
  hf_token:
    environment: HF_TOKEN
  # The edge owns this file (a Keycloak client secret). A file-backed secret
  # keeps it out of `docker inspect` and the environment; it is read once at
  # startup by the web relying party. A throwaway stack (CI, local e2e) points
  # KEYCLOAK_CLIENT_SECRET_FILE at a file of its own.
  keycloak_client_secret:
    file: ${KEYCLOAK_CLIENT_SECRET_FILE:-${HOME}/.secrets/keycloak/clients/songmaker}
  # hal owns this file (the app key for its LiteLLM gateway). A throwaway stack
  # points GATEWAY_KEY_FILE at a file of its own.
  gateway_key:
    file: ${GATEWAY_KEY_FILE:-${HOME}/.secrets/litellm/apps/songmaker}
  # Mounted into the alertmanager container at /run/secrets/smtp_password
  # instead of being passed as an environment variable: a secret in
  # `environment:` is visible in `docker inspect` and `docker compose
  # config` for anyone on the host, and would additionally have to survive
  # a text substitution on its way into the config (issue #333).
  smtp_password:
    environment: SMTP_PASSWORD
  # The songmaker secrets, one file each (made by hal setup;
  # scripts/secret_files.py copies an existing .env once).
  # Rotating one is a file write plus a recreate of its readers. A throwaway
  # stack (CI, local e2e) points SONGMAKER_SECRETS_DIR at a directory of its own.
  session_secret:
    file: ${SONGMAKER_SECRETS_DIR:-${HOME}/.secrets/songmaker}/session-secret
  postgres_password:
    file: ${SONGMAKER_SECRETS_DIR:-${HOME}/.secrets/songmaker}/postgres-password
  songmaker_internal_token:
    file: ${SONGMAKER_SECRETS_DIR:-${HOME}/.secrets/songmaker}/internal-token
  songmaker_monitoring_token:
    file: ${SONGMAKER_SECRETS_DIR:-${HOME}/.secrets/songmaker}/monitoring-token

# Created by the edge stack (one network per app); the deploy follows its apply.
networks:
  backchannel:
    name: hal_backchannel_songmaker
    external: true
  # Edge's per-app network for the co-writer: songmaker-web reaches the gateway
  # front on it.
  hal_agent_songmaker:
    external: true

volumes:
  pgdata:
  redisdata:
  audiofiles:
  queuestreams:
  hfcache:
  promdata:
  grafdata:
  alertmanagerdata:
