packages:
  - .

# deepmerge 4.3.1 has an unfixed prototype-poisoning advisory (GHSA-gcqx-w48m-w2h4).
# vite-plugin-svelte's one call site is patched to merge itself, and the override drops
# the now unused dependency from the lockfile (package.json pnpm.overrides, which wins
# over this file's overrides).
patchedDependencies:
  '@sveltejs/vite-plugin-svelte@7.3.1': patches/@sveltejs__vite-plugin-svelte@7.3.1.patch

overrides:
  picomatch: '>=4.0.4'
  brace-expansion: '>=5.0.5'
  # Floor is a CVE hardening (cookie <0.7.0), not a compat statement; it has no
  # ceiling, so it floats to ESM-only cookie@2, whose renamed exports
  # @sveltejs/kit's import doesn't know. frontend/package.json's
  # pnpm.overrides.cookie pin sets the ceiling — read both together.
  cookie: '>=0.7.0'
