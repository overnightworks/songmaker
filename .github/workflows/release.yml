name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: The version to release, YYYY.MM.DD.N
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  gate:
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    uses: overnightworks/quality/.github/workflows/release-gate.yml@2d2b68bf3916b34f6f2c72a540c1e3d8a947b750 # v0.10.0
    with:
      version: ${{ inputs.version }}
      form: YYYY.MM.DD.N

  image:
    name: image (${{ matrix.image }})
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: web
            file: Dockerfile
            build-args: |
              SONGMAKER_RELEASE=v${{ inputs.version }}
              SONGMAKER_COMMIT=${{ needs.gate.outputs.commit }}
          - image: music-worker
            file: docker/music-worker.Dockerfile
          - image: scoring-worker
            file: docker/scoring-worker.Dockerfile
          - image: acestep-worker
            file: docker/acestep-worker.Dockerfile
            submodules: true
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    uses: overnightworks/quality/.github/workflows/image.yml@2d2b68bf3916b34f6f2c72a540c1e3d8a947b750 # v0.10.0
    with:
      image: ${{ matrix.image }}
      file: ${{ matrix.file }}
      version: ${{ inputs.version }}
      build-args: ${{ matrix.build-args || '' }}
      submodules: ${{ matrix.submodules || false }}
      push: true

  tag:
    needs: [gate, image]
    permissions:
      contents: write
    uses: overnightworks/quality/.github/workflows/release-tag.yml@2d2b68bf3916b34f6f2c72a540c1e3d8a947b750 # v0.10.0
    with:
      version: ${{ inputs.version }}
      commit: ${{ needs.gate.outputs.commit }}

  layers:
    name: layers (${{ matrix.image }})
    needs: [gate, image]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        image: [web, music-worker, scoring-worker, acestep-worker]
    permissions:
      contents: read
      packages: read
    env:
      IMAGE: ${{ matrix.image }}
      VERSION: ${{ inputs.version }}
      REPOSITORY: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.x
        with:
          ref: ${{ needs.gate.outputs.commit }}
          persist-credentials: false
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - shell: bash # pipefail: a failed tag list must not read as no earlier release
        run: |
          gh api --paginate "repos/$REPOSITORY/git/matching-refs/tags/v" --jq '.[].ref' \
            | python3 scripts/release_layer_delta.py --repository "$REPOSITORY" --image "$IMAGE" --version "$VERSION"
