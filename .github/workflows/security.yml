name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # Weekly Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_PYTHON_PREFERENCE: only-managed # why: bandit runs on uv's managed interpreter, not the runner's own Python.

concurrency:
  group: security-${{ github.ref }}
  # Keep main runs queued so each landing can become a deploy candidate (2026-09-05).
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  bandit:
    name: Bandit (Python security)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.x
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Run bandit
        run: uvx --isolated --python "$(cat .python-version)" --from 'bandit[toml]>=1.8,<2' bandit -r src/ -c pyproject.toml # why: Bandit runs in its own tool environment so its resolution cannot change worker-image dependencies.
