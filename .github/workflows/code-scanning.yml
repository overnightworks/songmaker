name: CodeQL

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read

jobs:
  codeql:
    permissions:
      security-events: write
      contents: read
      actions: read
    uses: overnightworks/quality/.github/workflows/codeql.yml@64009e7eba23ba7d3c5d2b2df0e7d68b71b27a73 # v0.8.0
    with:
      languages: '["actions", "javascript-typescript", "python"]'
