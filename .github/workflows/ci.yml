name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_PYTHON_PREFERENCE: only-managed # why: setup-uv only sets UV_PYTHON; without this uv takes the runner's own Python, whose patch differs from the images'.
  # The Python every backend job runs and the number of shards the backend tests are cut into: the
  # matrix of backend-shard lists one job per shard, and the aggregator requires all of them.
  # Not named TEST_SHARDS: that name without TEST_SHARD is a usage error in every job that runs pytest.
  BACKEND_PYTHON: "3.14"
  BACKEND_SHARD_TOTAL: 3

concurrency:
  # A pull request's runs share a group by its number and a newer run cancels the older.
  # Every other run, a push to main included, has a group of its own (its run id), so no other run can cancel it.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The backend's static checks: they need no service and no system package, and run beside the shards.
  backend-static:
    name: Backend static checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.x
        with:
          persist-credentials: false

      # The one job that writes the uv cache is this one on main: an entry written for a pull request is
      # readable only by that pull request's runs and counts against the shared quota, and jobs saving one key race.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ env.BACKEND_PYTHON }}
          enable-cache: true
          save-cache: ${{ github.ref == 'refs/heads/main' }}

      - name: Check uv.lock is in sync with pyproject.toml
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --frozen --extra server --extra dev --extra agent --extra image --extra signal # why: songmaker is a first-party source project, so --no-build cannot install its editable distribution.

      - name: Ruff lint
        run: uv run --no-sync --frozen --no-build ruff check src/ tests/

      - name: Test helper duplication ratchet
        run: uv run --no-sync --frozen --no-build scripts/test_helper_ratchet.sh

      - name: No silent-fallback smell check
        run: uv run --no-sync --frozen --no-build python scripts/check_no_silent_fallbacks.py src/

      - name: No unreferenced backend symbols
        run: uv run --no-sync --frozen --no-build python scripts/check_dead_symbols.py

      - name: CI and compose pin the same Postgres and Redis images
        run: uv run --no-sync --frozen --no-build python scripts/check_pinned_images_match.py

      - name: Every requirement is cited by a test
        run: uv run --no-sync --frozen --no-build python scripts/check_requirement_citations.py

      - name: Check TypeScript types in sync
        run: uv run --no-sync --frozen --no-build python scripts/generate_types.py --check

      - name: Catalogs and their modules are current
        run: uv run --no-sync --frozen --no-build design-catalogs --check

  # One shard of the backend tests, on a runner and a PostgreSQL service of its own.
  backend-shard:
    name: Backend tests (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 15 # why: a hung test must fail the run, not hold the queued runs.
    services:
      postgres:
        image: postgres:16.15-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
        env:
          POSTGRES_USER: songmaker
          POSTGRES_PASSWORD: songmaker # why: disposable password for this isolated GitHub Actions service container.
          POSTGRES_DB: songmaker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U songmaker -d songmaker_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7.4.12-alpine@sha256:338fbfc036dc5517ac0b04d6de21521085935336e565f223406180e9d84166e2
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://songmaker:songmaker@localhost:5432/songmaker_test # why: disposable password for this isolated GitHub Actions service container.
      TEST_REDIS_URL: redis://localhost:6379
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.x
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ env.BACKEND_PYTHON }}
          enable-cache: true
          save-cache: false

      - name: Install dependencies
        run: uv sync --frozen --extra server --extra dev --extra agent --extra image --extra signal # why: songmaker is a first-party source project, so --no-build cannot install its editable distribution.

      - name: Show installed FastAPI version
        run: uv run --no-sync --frozen --no-build python -c "import fastapi; print(f'FastAPI {fastapi.__version__}')"

      - name: Turn off the disposable service's durability
        # why: the service is thrown away with the job, so it needs no crash safety; tests/support/postgresql.py never changes server settings.
        env:
          SERVICE: ${{ job.services.postgres.id }}
        run: |
          psql() { docker exec "$SERVICE" psql --username songmaker --dbname songmaker_test --no-psqlrc --tuples-only --no-align "$@"; }
          for setting in fsync synchronous_commit full_page_writes; do
            psql --command "ALTER SYSTEM SET $setting = off"
          done
          psql --command "SELECT pg_reload_conf()"
          for _ in $(seq 10); do
            effective=$(psql --command "SELECT string_agg(setting, ',' ORDER BY name) FROM pg_settings WHERE name IN ('fsync', 'synchronous_commit', 'full_page_writes')")
            [ "$effective" = "off,off,off" ] && exit 0
            sleep 1
          done
          echo "Durability settings are still $effective after reload" >&2
          exit 1

      - name: Run tests with coverage
        env:
          TEST_SHARD: ${{ matrix.shard }}
          TEST_SHARDS: ${{ env.BACKEND_SHARD_TOTAL }}
          COVERAGE_FILE: reports/coverage-data-backend
        run: |
          mkdir -p reports
          uv run --no-sync --frozen --no-build pytest tests/ -n auto -q --tb=short --junitxml=reports/backend-junit.xml --cov=songmaker_cli --cov=audio_engine --cov=acestep_engine --cov=acestep_worker --cov-report=term-missing --cov-config=.github/workflows/coveragerc-ci.ini

      # The aggregator proves from these files that the shards together ran every
      # collected test and judges the floors over their coverage data; a shard
      # whose file is missing fails here and so fails the job.
      - name: Upload the JUnit report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.x
        with:
          name: junit-backend-${{ matrix.shard }}-${{ github.run_attempt }}
          path: reports/backend-junit.xml
          if-no-files-found: error
          overwrite: false
          retention-days: 14

      - name: Upload backend coverage data
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.x
        with:
          name: coverage-data-backend-${{ matrix.shard }}-${{ github.run_attempt }}
          path: reports/coverage-data-backend
          if-no-files-found: error
          overwrite: false
          retention-days: 14

  # The backend's one mandatory job: it stays one name however the shards are cut.
  # It runs when the static job or a shard fails, is cancelled or is skipped, so it
  # reports their real result; a skipped check run would be left unjudged by the
  # deploy's reading of a main commit's checks. Its first step fails on their result.
  # Every later step runs after a failed one, so the comparison names the tests a
  # failed shard left out.
  backend:
    name: Backend (Python 3.14) # why: a job name cannot read env, so this repeats BACKEND_PYTHON; a test requires the two equal.
    needs: [backend-static, backend-shard]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fail unless the static checks and every shard succeeded
        env:
          STATIC_RESULT: ${{ needs.backend-static.result }}
          SHARD_RESULT: ${{ needs.backend-shard.result }}
        run: |
          echo "backend-static: $STATIC_RESULT"
          echo "backend-shard: $SHARD_RESULT"
          test "$STATIC_RESULT" = success
          test "$SHARD_RESULT" = success

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.x
        if: ${{ !cancelled() }}
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        if: ${{ !cancelled() }}
        with:
          python-version: ${{ env.BACKEND_PYTHON }}
          enable-cache: true
          save-cache: false

      # The collection imports every test module, so it needs the shards' extras.
      - name: Install dependencies
        if: ${{ !cancelled() }}
        run: uv sync --frozen --extra server --extra dev --extra agent --extra image --extra signal # why: songmaker is a first-party source project, so --no-build cannot install its editable distribution.

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.x
        if: ${{ !cancelled() }}
        with:
          node-version-file: frontend/.node-version
          check-latest: true

      - name: Download the JUnit reports
        if: ${{ !cancelled() }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: junit-backend-*
          path: ${{ runner.temp }}/junit

      # A re-run of failed jobs uploads again under a higher attempt while the green
      # shards keep their first one, so each shard's newest attempt is the one read.
      # A shard without a report fails this step; the comparison still runs on the rest.
      - name: Choose the newest report of each shard
        if: ${{ !cancelled() }}
        run: |
          node frontend/e2e/shard-artifacts.ts junit backend "$BACKEND_SHARD_TOTAL" "$RUNNER_TEMP/junit" > "$RUNNER_TEMP/chosen-junit.txt"
          cat "$RUNNER_TEMP/chosen-junit.txt"

      - name: Copy the chosen reports where the identity check reads them
        if: ${{ !cancelled() }}
        run: |
          mkdir -p reports
          while read -r directory; do
            shard=${directory##*/junit-backend-}
            cp "$directory/backend-junit.xml" "reports/backend-junit-${shard%%-*}.xml"
          done < "$RUNNER_TEMP/chosen-junit.txt"

      # The listing is made with the shards' checkout, extras and Python and without
      # a shard selection, so it holds every test a shard may run. It has no pipe,
      # so the step fails on pytest's own exit code; -n and --cov change no node id.
      - name: Collect the backend tests
        if: ${{ !cancelled() }}
        run: |
          mkdir -p reports
          # pytest-workers: --collect-only runs no test, so there is nothing to spread over workers.
          uv run --no-sync --frozen --no-build pytest tests/ --collect-only -q -p no:cacheprovider > reports/backend-collected.txt

      - name: Compare the shards with the collected tests
        if: ${{ !cancelled() }}
        run: uv run --no-sync --frozen --no-build python scripts/check_backend_shard_identity.py "$BACKEND_SHARD_TOTAL"

      - name: Require every database proof to execute
        if: ${{ !cancelled() }}
        run: |
          uv run --no-sync python - <<'PYTHON'
          import collections
          import os
          import xml.etree.ElementTree as ET

          cases = [
              case
              for shard in range(1, int(os.environ["BACKEND_SHARD_TOTAL"]) + 1)
              for case in ET.parse(f"reports/backend-junit-{shard}.xml").iter("testcase")
              if any(
                  prop.attrib["name"] == "database_case" for prop in case.iter("property")
              )
          ]
          assert cases, "No database proof selected"
          skipped = [case for case in cases if case.find("skipped") is not None]
          assert not skipped, (
              "Database proofs skipped: "
              f"{[(case.attrib['classname'], case.attrib['name']) for case in skipped]}"
          )
          counts = collections.Counter(case.attrib["classname"] for case in cases)
          assert any(name.endswith("test_reference_audio_quota") for name in counts), (
              "No PostgreSQL reference quota proofs executed"
          )
          for name, count in sorted(counts.items()):
              print(f"{name}: {count} passed, 0 skipped")
          PYTHON

      - name: Backend test summary
        if: ${{ !cancelled() }}
        run: |
          uv run --no-sync python - <<'PYTHON'
          import os
          import xml.etree.ElementTree as ET

          fields = ("tests", "skipped", "failures", "errors")
          total = dict.fromkeys(fields, 0)
          lines = []
          for shard in range(1, int(os.environ["BACKEND_SHARD_TOTAL"]) + 1):
              suites = ET.parse(f"reports/backend-junit-{shard}.xml").iter("testsuite")
              counts = dict.fromkeys(fields, 0)
              for suite in suites:
                  for field in fields:
                      counts[field] += int(suite.attrib[field])
              lines.append(f"- shard {shard}: " + ", ".join(f"{counts[f]} {f}" for f in fields))
              for field in fields:
                  total[field] += counts[field]
          lines.insert(0, "### Backend: " + ", ".join(f"{total[f]} {f}" for f in fields))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as handle:
              handle.write("\n".join(lines) + "\n")
          PYTHON

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.x
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.x
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.x
        with:
          node-version-file: frontend/.node-version
          check-latest: true
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Svelte check
        run: pnpm check

      - name: No test-only-alive exports
        run: bash ../scripts/check_test_only_exports.sh

      - name: No new style literals
        run: python3 ../scripts/check_style_literals.py

      - name: Lint
        run: pnpm lint

      - name: Tests with coverage
        run: |
          set -o pipefail
          pnpm test:coverage | tee vitest-output.txt

      - name: Production build
        run: pnpm build

      - name: Test summary
        if: always()
        run: |
          line=$(grep -E '^\s*Tests\s' vitest-output.txt || echo 'Tests  ? passed')
          cov=$(grep -E 'Statements\s*:' vitest-output.txt | tail -1 || true)
          echo "### Frontend: ${line}" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$cov" ]; then echo "### Coverage: ${cov}" >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Upload frontend coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.x
        with:
          name: sonar-coverage-frontend
          # Upload the reports root so the assembly job restores the LCOV file
          # at reports/frontend-coverage/lcov.info before combining both reports.
          path: reports
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  backend-coverage:
    name: Combine backend coverage
    needs: [backend]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.x
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ env.BACKEND_PYTHON }}
          enable-cache: true
          save-cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.x
        with:
          node-version-file: frontend/.node-version
          check-latest: true
      - name: Install coverage tooling
        run: uv sync --frozen --no-install-project --extra dev

      - name: Download backend coverage data
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-data-backend-*
          path: reports/shard-coverage

      # The aggregator compared the newest report of each shard, so the data of the same attempt is combined.
      - name: Choose the newest coverage data of each shard
        run: |
          node frontend/e2e/shard-artifacts.ts coverage-data backend "$BACKEND_SHARD_TOTAL" reports/shard-coverage > reports/chosen-coverage.txt
          cat reports/chosen-coverage.txt

      - name: Combine backend coverage
        run: |
          set -o pipefail
          mapfile -t inputs < <(sed 's|$|/coverage-data-backend|' reports/chosen-coverage.txt)
          uv run --no-sync coverage combine --rcfile=.github/workflows/coveragerc-ci.ini --data-file=reports/coverage-data "${inputs[@]}" | tee reports/combine.log
          # coverage combine exits 0 when an input is unreadable, so each expected input must be reported as combined.
          # It prints each input's path relative to the working directory, which is how the inputs are named here.
          for input in "${inputs[@]}"; do
            grep -qxF "Combined data file $input" reports/combine.log || { echo "::error::coverage combine did not combine $input"; exit 1; }
          done
          uv run --no-sync coverage xml --rcfile=.github/workflows/coveragerc-ci.ini --data-file=reports/coverage-data -o reports/coverage.xml

      - name: Coverage summary and floors
        env:
          LINE_FLOOR: "93"
          BRANCH_FLOOR: "97"
        run: |
          # coverage.py's fail_under judges lines and branches combined, so each floor is checked here.
          uv run --no-sync python - <<'PY'
          import os
          import xml.etree.ElementTree as ET

          root = ET.parse("reports/coverage.xml").getroot()
          line_percent = 100 * int(root.get("lines-covered")) / int(root.get("lines-valid"))
          branch_percent = 100 * int(root.get("branches-covered")) / int(root.get("branches-valid"))
          line_floor = int(os.environ["LINE_FLOOR"])
          branch_floor = int(os.environ["BRANCH_FLOOR"])
          summary = f"Line coverage {line_percent:.2f} % (floor {line_floor} %), branch coverage {branch_percent:.2f} % (floor {branch_floor} %)"
          print(summary)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as handle:
              handle.write(summary + "\n")
          raise SystemExit(0 if line_percent >= line_floor and branch_percent >= branch_floor else "coverage below a floor")
          PY

      - name: Upload combined backend coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.x
        with:
          name: sonar-coverage-backend
          path: reports/coverage.xml
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  coverage:
    name: Assemble coverage
    needs: [backend-coverage, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download backend coverage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sonar-coverage-backend
          path: reports

      - name: Download frontend coverage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sonar-coverage-frontend
          path: reports

      - name: Require both coverage reports
        run: |
          test -s reports/coverage.xml
          test -s reports/frontend-coverage/lcov.info

      - name: Upload assembled coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.x
        with:
          name: coverage
          path: |
            reports/coverage.xml
            reports/frontend-coverage/lcov.info
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  e2e:
    name: E2E
    permissions:
      contents: read
    uses: $/.github/workflows/e2e.yml

  quality:
    needs: [backend, backend-coverage, frontend, coverage, e2e]
    if: ${{ !cancelled() }}
    permissions:
      contents: read
      actions: read
    uses: overnightworks/quality/.github/workflows/gate.yml@be32abeb120d29f75ee7ea456d6e510ae001de04 # v0.12.0
    with:
      coverage-artifact: coverage
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
