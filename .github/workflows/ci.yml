name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Keep main runs queued so each landing can become a deploy candidate (2026-09-05).
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  backend:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.x
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.x
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Check uv.lock is in sync with pyproject.toml
        run: uv lock --check

      - name: Cache uv packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.x
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('uv.lock') }}
          restore-keys: uv-${{ runner.os }}-${{ matrix.python-version }}-

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg redis-server
        timeout-minutes: 10 # why: a hung apt mirror must fail fast, not hold the queued main runs behind it for hours.

      - name: Install dependencies
        run: uv sync --frozen --extra server --extra dev --extra mcp --extra image # why: songmaker is a first-party source project, so --no-build cannot install its editable distribution.

      - name: Show installed FastAPI version
        run: uv run --no-sync --frozen --no-build python -c "import fastapi; print(f'FastAPI {fastapi.__version__}')"

      - name: Ruff lint
        run: uv run --no-sync --frozen --no-build ruff check src/ tests/

      - name: Test helper duplication ratchet
        run: scripts/test_helper_ratchet.sh

      - name: No silent-fallback smell check
        run: uv run --no-sync --frozen --no-build python scripts/check_no_silent_fallbacks.py src/

      - name: No unreferenced backend symbols
        run: uv run --no-sync --frozen --no-build python scripts/check_dead_symbols.py

      - name: Repository root layout
        run: uv run --no-sync --frozen --no-build python scripts/check_root_layout.py

      - name: Check TypeScript types in sync
        run: uv run --no-sync --frozen --no-build python scripts/generate_types.py --check

      - name: Import boundaries
        run: uv run --no-sync --frozen --no-build lint-imports

      - name: Run tests with coverage
        run: |
          set -o pipefail
          mkdir -p reports
          uv run --no-sync --frozen --no-build pytest tests/ -n auto -q --tb=short --cov=songmaker_cli --cov=audio_engine --cov=acestep_engine --cov=acestep_worker --cov-report=term-missing --cov-report=xml:reports/coverage.xml --cov-fail-under=93 --cov-config=.github/workflows/coveragerc-ci | tee pytest-output.txt

      - name: Coverage summary
        if: always()
        run: |
          total=$(grep '^TOTAL' pytest-output.txt | awk '{print $NF}')
          passed=$(grep -oP '^\d+ passed' pytest-output.txt | awk '{print $1}')
          skipped=$(grep -oP '\d+ skipped' pytest-output.txt | awk '{print $1}')
          echo "### Backend: ${passed} passed, ${skipped:-0} skipped — ${total} coverage" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload backend coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.x
        with:
          name: sonar-coverage-backend
          path: reports/coverage.xml
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  alert-rules:
    name: Alert rules (promtool)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.x
        with:
          persist-credentials: false

      # The rules are Prometheus' own schema, so Prometheus' own tool is
      # the only honest checker — and it comes in the same image the
      # compose stack runs, rather than as a second thing to install.
      # `test rules` drives monitoring/alert.rules.test.yml against the
      # real rule file (issue #333).
      - name: Check and unit-test the alert rules
        run: |
          run_promtool() {
            docker run --rm -v "$PWD/monitoring:/monitoring:ro" -w /monitoring \
              --entrypoint promtool prom/prometheus:latest "$@"
          }
          docker run --rm -v "$PWD/monitoring:/etc/prometheus:ro" \
            --entrypoint promtool prom/prometheus:latest check config /etc/prometheus/prometheus.yml
          run_promtool check rules rules/alert.rules.yml
          run_promtool test rules alert.rules.test.yml

  postgresql-contract:
    name: PostgreSQL contract (serial)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: songmaker
          POSTGRES_PASSWORD: songmaker # why: disposable password for this isolated GitHub Actions service container.
          POSTGRES_DB: songmaker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U songmaker -d songmaker_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://songmaker:songmaker@localhost:5432/songmaker_test # why: disposable password for this isolated GitHub Actions service container.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.x
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.x
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Install dependencies
        run: uv sync --frozen --extra server --extra dev --extra image # why: songmaker is a first-party source project, so --no-build cannot install its editable distribution.
      - name: Show installed FastAPI version
        run: uv run --no-sync --frozen --no-build python -c "import fastapi; print(f'FastAPI {fastapi.__version__}')"
      - name: Run PostgreSQL contracts serially
        run: uv run --no-sync --frozen --no-build pytest tests/test_postgresql.py tests/test_cover_accounting.py tests/test_reference_quota.py tests/test_auth_write_lock_postgres.py tests/test_merge_accounts_into_subject.py -n 0 -v --tb=short --junitxml=postgresql-contract.xml
      - name: Require executed PostgreSQL reference quota and write lock proofs
        run: |
          python - <<'PYTHON'
          import xml.etree.ElementTree as ET

          cases = [
              case for case in ET.parse("postgresql-contract.xml").iter("testcase")
              if case.attrib["classname"].endswith("test_reference_quota")
              and (
                  "postgresql" in case.attrib["name"].partition("[")[2]
                  or (
                      "[" not in case.attrib["name"]
                      and case.attrib["name"].startswith("test_postgresql_")
                  )
              )
          ]
          assert cases, "No PostgreSQL reference quota proofs executed"
          assert not any(case.find("skipped") is not None for case in cases), "Quota proof skipped"
          print(f"PostgreSQL reference quota proofs: {len(cases)} passed, 0 skipped")
          lock_cases = [
              case for case in ET.parse("postgresql-contract.xml").iter("testcase")
              if case.attrib["classname"].endswith("test_auth_write_lock_postgres")
          ]
          assert len(lock_cases) == 2, f"Expected 2 PostgreSQL write lock proofs, got {len(lock_cases)}"
          assert not any(case.find("skipped") is not None for case in lock_cases), "Write lock proof skipped"
          print(f"PostgreSQL write lock proofs: {len(lock_cases)} passed, 0 skipped")
          PYTHON

  frontend:
    name: Frontend (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["22"]

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.x
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.x
        with:
          version: 10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.x
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Svelte check
        run: pnpm check

      - name: No test-only-alive exports
        run: bash ../scripts/check_test_only_exports.sh

      - name: No new style literals
        run: python3 ../scripts/check_style_literals.py

      - name: Lint
        run: pnpm lint

      - name: Tests with coverage
        run: |
          set -o pipefail
          pnpm test:coverage | tee vitest-output.txt

      - name: Production build
        run: pnpm build

      - name: Test summary
        if: always()
        run: |
          line=$(grep -E '^\s*Tests\s' vitest-output.txt || echo 'Tests  ? passed')
          cov=$(grep -E 'Statements\s*:' vitest-output.txt | tail -1 || true)
          echo "### Frontend: ${line}" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$cov" ]; then echo "### Coverage: ${cov}" >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Upload frontend coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.x
        with:
          name: sonar-coverage-frontend
          # Upload the reports root so the assembly job restores the LCOV file
          # at reports/frontend-coverage/lcov.info before combining both reports.
          path: reports
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  coverage:
    name: Assemble coverage
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download backend coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sonar-coverage-backend
          path: reports

      - name: Download frontend coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sonar-coverage-frontend
          path: reports

      - name: Require both coverage reports
        run: |
          test -s reports/coverage.xml
          test -s reports/frontend-coverage/lcov.info

      - name: Upload assembled coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.x
        with:
          name: coverage
          path: |
            reports/coverage.xml
            reports/frontend-coverage/lcov.info
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  quality:
    needs: [backend, alert-rules, postgresql-contract, frontend, coverage]
    if: ${{ !cancelled() }}
    permissions:
      contents: read
      actions: read
    uses: overnightworks/quality/.github/workflows/gate.yml@61fd8621b20a604a7ef4b1154d1b6ed484d2ed66 # v0.4.0
    with:
      coverage-artifact: coverage
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
