name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Keep main runs queued so each landing can become a deploy candidate (2026-09-05).
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  backend:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 75 # why: a hung job must not hold the queued main runs for six hours.
    env:
      UV_PYTHON: ${{ matrix.python-version }} # why: .python-version would otherwise win over the matrix leg.
    strategy:
      matrix:
        python-version: ["3.12", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.x
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.x
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Check uv.lock is in sync with pyproject.toml
        run: uv lock --check

      - name: Cache uv packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.x
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('uv.lock') }}
          restore-keys: uv-${{ runner.os }}-${{ matrix.python-version }}-

      - name: Install system dependencies
        # why: tests/support/redis_server.py spawns a real redis-server on a unix socket, so a service container cannot stand in, and the generation tests encode MP3s with a real ffmpeg. The runner image's package lists usually know both packages, so apt-get update is only the fallback; short timeouts and retries make a stalled mirror fail fast.
        run: |
          apt_options="-o Acquire::Retries=3 -o Acquire::http::Timeout=30"
          sudo apt-get install -y $apt_options ffmpeg redis-server \
            || { sudo apt-get update $apt_options && sudo apt-get install -y $apt_options ffmpeg redis-server; }
        timeout-minutes: 45 # why: a hung apt mirror must fail, not hold the queued main runs behind it for hours.

      - name: Install dependencies
        run: uv sync --frozen --extra server --extra dev --extra mcp --extra agent-service --extra image # why: songmaker is a first-party source project, so --no-build cannot install its editable distribution.

      - name: Show installed FastAPI version
        run: uv run --no-sync --frozen --no-build python -c "import fastapi; print(f'FastAPI {fastapi.__version__}')"

      - name: Ruff lint
        run: uv run --no-sync --frozen --no-build ruff check src/ tests/

      - name: Test helper duplication ratchet
        run: scripts/test_helper_ratchet.sh

      - name: No silent-fallback smell check
        run: uv run --no-sync --frozen --no-build python scripts/check_no_silent_fallbacks.py src/

      - name: No unreferenced backend symbols
        run: uv run --no-sync --frozen --no-build python scripts/check_dead_symbols.py

      - name: Repository root layout
        run: uv run --no-sync --frozen --no-build python scripts/check_root_layout.py

      - name: CI and compose pin the same Postgres image
        run: uv run --no-sync --frozen --no-build python scripts/check_pinned_images_match.py

      - name: Check TypeScript types in sync
        run: uv run --no-sync --frozen --no-build python scripts/generate_types.py --check

      - name: Run tests with coverage
        run: |
          set -o pipefail
          mkdir -p reports
          uv run --no-sync --frozen --no-build pytest tests/ -n auto -q --tb=short --cov=songmaker_cli --cov=audio_engine --cov=acestep_engine --cov=acestep_worker --cov-report=term-missing --cov-report=xml:reports/coverage.xml --cov-fail-under=93 --cov-config=.github/workflows/coveragerc-ci.ini | tee pytest-output.txt

      - name: Coverage summary
        if: always()
        run: |
          total=$(grep '^TOTAL' pytest-output.txt | awk '{print $NF}')
          passed=$(grep -oP '^\d+ passed' pytest-output.txt | awk '{print $1}')
          skipped=$(grep -oP '\d+ skipped' pytest-output.txt | awk '{print $1}')
          echo "### Backend: ${passed} passed, ${skipped:-0} skipped — ${total} coverage" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload backend coverage
        if: ${{ !cancelled() && matrix.python-version == '3.14' }} # why: one leg owns the single Sonar coverage report.
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.x
        with:
          name: sonar-coverage-backend
          path: reports/coverage.xml
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  alert-rules:
    name: Alert rules (promtool)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.x
        with:
          persist-credentials: false

      # The rules are Prometheus' own schema, so Prometheus' own tool is
      # the only honest checker — and it comes in the same image the
      # compose stack runs, rather than as a second thing to install.
      # `test rules` drives monitoring/alert.rules.test.yml against the
      # real rule file (issue #333).
      - name: Check and unit-test the alert rules
        run: |
          run_promtool() {
            docker run --rm -v "$PWD/monitoring:/monitoring:ro" -w /monitoring \
              --entrypoint promtool prom/prometheus:v3.15.1@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2 "$@"
          }
          docker run --rm -v "$PWD/monitoring:/etc/prometheus:ro" \
            --entrypoint promtool prom/prometheus:v3.15.1@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2 check config /etc/prometheus/prometheus.yml
          run_promtool check rules rules/alert.rules.yml
          run_promtool test rules alert.rules.test.yml

  postgresql-contract:
    name: PostgreSQL contract (serial)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16.15-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
        env:
          POSTGRES_USER: songmaker
          POSTGRES_PASSWORD: songmaker # why: disposable password for this isolated GitHub Actions service container.
          POSTGRES_DB: songmaker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U songmaker -d songmaker_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://songmaker:songmaker@localhost:5432/songmaker_test # why: disposable password for this isolated GitHub Actions service container.
      POSTGRESQL_CONTRACT_MODULES: >-
        tests/songmaker_cli/test_db_postgresql.py
        tests/songmaker_cli/test_cover_runner_accounting.py
        tests/test_reference_quota.py
        tests/test_auth_write_lock_postgres.py
        tests/test_person_token_paths_postgres.py
        tests/test_reference_attach_lock_postgres.py
        tests/test_song_version_lock_postgres.py
        tests/songmaker_cli/mcp_server/test_tools_coherence_verdict_lock_postgres.py
        tests/songmaker_cli/db/test_migrations_coherence_verdict.py
        tests/songmaker_cli/db/test_migrations_reference_recordings.py
        tests/songmaker_cli/db/test_migrations_version_reference_link.py
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.x
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.x
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Install dependencies
        run: uv sync --frozen --extra server --extra dev --extra agent-service --extra image --extra mcp # why: songmaker is a first-party source project, so --no-build cannot install its editable distribution.
      - name: Show installed FastAPI version
        run: uv run --no-sync --frozen --no-build python -c "import fastapi; print(f'FastAPI {fastapi.__version__}')"
      - name: Run PostgreSQL contracts serially
        run: uv run --no-sync --frozen --no-build pytest $POSTGRESQL_CONTRACT_MODULES -n 0 -v --tb=short --junitxml=postgresql-contract.xml
      - name: Require executed PostgreSQL reference quota and write lock proofs
        run: |
          python - <<'PYTHON'
          import os
          import pathlib
          import xml.etree.ElementTree as ET

          cases = [
              case for case in ET.parse("postgresql-contract.xml").iter("testcase")
              if case.attrib["classname"].endswith("test_reference_quota")
              and (
                  "postgresql" in case.attrib["name"].partition("[")[2]
                  or (
                      "[" not in case.attrib["name"]
                      and case.attrib["name"].startswith("test_postgresql_")
                  )
              )
          ]
          assert cases, "No PostgreSQL reference quota proofs executed"
          assert not any(case.find("skipped") is not None for case in cases), "Quota proof skipped"
          print(f"PostgreSQL reference quota proofs: {len(cases)} passed, 0 skipped")
          cases = list(ET.parse("postgresql-contract.xml").iter("testcase"))
          for path in os.environ["POSTGRESQL_CONTRACT_MODULES"].split():
              module = pathlib.PurePath(path).stem
              module_cases = [case for case in cases if module in case.attrib["classname"].split(".")]
              assert module_cases, f"{module} executed no case"
              assert not any(case.find("skipped") is not None for case in module_cases), f"{module} proof skipped"
              print(f"{module}: {len(module_cases)} passed, 0 skipped")
          PYTHON

  frontend:
    name: Frontend (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node-version: ["22"]

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.x
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.x
        with:
          version: 10

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.x
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Svelte check
        run: pnpm check

      - name: No test-only-alive exports
        run: bash ../scripts/check_test_only_exports.sh

      - name: No new style literals
        run: python3 ../scripts/check_style_literals.py

      - name: Lint
        run: pnpm lint

      - name: Tests with coverage
        run: |
          set -o pipefail
          pnpm test:coverage | tee vitest-output.txt

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.x
        with:
          python-version-file: .python-version

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Copy the appkit look
        working-directory: .
        run: uv run --frozen --only-group frontend python scripts/copy_kit_assets.py

      - name: Production build
        run: pnpm build

      - name: Test summary
        if: always()
        run: |
          line=$(grep -E '^\s*Tests\s' vitest-output.txt || echo 'Tests  ? passed')
          cov=$(grep -E 'Statements\s*:' vitest-output.txt | tail -1 || true)
          echo "### Frontend: ${line}" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$cov" ]; then echo "### Coverage: ${cov}" >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Upload frontend coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.x
        with:
          name: sonar-coverage-frontend
          # Upload the reports root so the assembly job restores the LCOV file
          # at reports/frontend-coverage/lcov.info before combining both reports.
          path: reports
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  coverage:
    name: Assemble coverage
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download backend coverage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sonar-coverage-backend
          path: reports

      - name: Download frontend coverage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sonar-coverage-frontend
          path: reports

      - name: Require both coverage reports
        run: |
          test -s reports/coverage.xml
          test -s reports/frontend-coverage/lcov.info

      - name: Upload assembled coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.x
        with:
          name: coverage
          path: |
            reports/coverage.xml
            reports/frontend-coverage/lcov.info
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  quality:
    needs: [backend, alert-rules, postgresql-contract, frontend, coverage]
    if: ${{ !cancelled() }}
    permissions:
      contents: read
      actions: read
    uses: overnightworks/quality/.github/workflows/gate.yml@02fbdd0fb1873b9ba91ba7735886ff6f700da1cc # v0.5.0
    with:
      coverage-artifact: coverage
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
