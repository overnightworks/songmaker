version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python-dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 5
    # why: keep pyproject ranges, move only uv.lock, so CI's `uv lock --check` holds
    versioning-strategy: lockfile-only
    ignore:
      # torchcodec's minor tracks torch's, which pyproject pins to one minor
      - dependency-name: "torchcodec"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      npm-dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 5
    # frontend/package.json pins pnpm.overrides.cookie to 1.1.1: @sveltejs/kit's
    # loose `cookie: '>=0.7.0'` range lets pnpm resolve cookie 2.x, which
    # renamed parse/serialize and breaks `pnpm build` against kit's runtime
    # import (no fixed kit release exists yet — see PR #130/issue #112).
    # Not a dependabot ignore: the pin lives in package.json, and a kit major
    # now arrives as its own PR because the groups carry only minor and patch.
    ignore:
      # jsdom 30.1.x breaks getComputedStyle on var()/color-mix() shorthands; the pin stays 30.0.1.
      - dependency-name: "jsdom"
        versions: [">=30.1.0, <30.2"]
      # TypeScript 7 needs svelte-check's dual TS6+TS7 --tsgo setup
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 5
