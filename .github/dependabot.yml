version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python-dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 5
    # why: keep pyproject ranges, move only uv.lock, so CI's `uv lock --check` holds
    versioning-strategy: lockfile-only
    ignore:
      # torchcodec's minor tracks torch's, which pyproject pins to one minor
      - dependency-name: "torchcodec"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      npm-dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 5
    ignore:
      # jsdom 30.1.x breaks getComputedStyle on var()/color-mix() shorthands; the pin stays 30.0.1.
      - dependency-name: "jsdom"
        versions: [">=30.1.0, <30.2"]
      # TypeScript 7 needs svelte-check's dual TS6+TS7 --tsgo setup
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # routerHistoryState.ts and router-history-layout.ts parse kit's history record with devalue; it stays on kit's major.
      - dependency-name: "devalue"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 5
  # A major or minor move of an image (postgres 17, python 3.13) is its own change;
  # for postgres it is a data migration.
  - package-ecosystem: docker
    directories:
      - /
      - /docker
      - /docker/base
    schedule:
      interval: weekly
    groups:
      docker-images:
        patterns: ["*"]
        update-types: ["patch"]
    open-pull-requests-limit: 5
    ignore:
      # local tags built on the host, not on a registry
      - dependency-name: "songmaker/acestep-base"
      - dependency-name: "songmaker/gpu-torch-base"
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    groups:
      compose-images:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 5
    ignore:
      # frozen until the monitoring stack is removed
      - dependency-name: "prom/prometheus"
      - dependency-name: "prom/alertmanager"
      - dependency-name: "grafana/grafana"
      # Dependabot reads 16.15 as major.minor, so the 16.x security releases are
      # its minor step: postgres moves within 16 (same data format), never to 17.
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
      - dependency-name: "redis"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
